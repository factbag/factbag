# Commits stay fast; heavier checks run before pushing and again in CI.
pre-commit:
  commands:
    format:
      glob: "*.{css,js,jsx,json,jsonc,md,mdx,ts,tsx,yaml,yml}"
      run: pnpm exec oxfmt --check {staged_files}

pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    examples:
      run: pnpm test:examples
    api-report:
      run: pnpm api-report:check
