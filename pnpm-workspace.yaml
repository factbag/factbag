packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"

catalog:
  "@changesets/cli": "3.0.3"
  "@microsoft/api-extractor": "7.58.9"
  "@storybook/addon-docs": "10.6.0"
  "@storybook/react-vite": "10.6.0"
  "@tailwindcss/vite": "4.3.3"
  "@types/node": "22.20.0"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.7"
  "@typesafe-ai/sdk": "0.6.0"
  ink: "7.1.1"
  knip: "6.24.0"
  lefthook: "2.1.9"
  lucide-react: "1.48.0"
  msw: "2.15.0"
  oxfmt: "0.58.0"
  oxlint: "1.73.0"
  oxlint-tsgolint: "7.0.2002"
  react: "19.2.7"
  react-dom: "19.2.7"
  storybook: "10.6.0"
  syncpack: "15.3.2"
  tailwindcss: "4.3.3"
  tsup: "8.5.1"
  turbo: "2.9.18"
  tsx: "4.23.0"
  typescript: "7.0.2"
  typescript6: "npm:typescript@6.0.2"
  vite: "8.3.1"
  vitest: "4.1.8"

minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Node-only HTTP interception; no browser worker setup needed.
  msw: false
engineStrict: true
