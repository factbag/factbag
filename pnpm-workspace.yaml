packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"

catalog:
  "@changesets/cli": "3.0.3"
  "@microsoft/api-extractor": "7.59.4"
  "@storybook/addon-docs": "10.6.2"
  "@storybook/react-vite": "10.6.2"
  "@tailwindcss/vite": "4.3.3"
  "@types/node": "22.20.0"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@typesafe-ai/sdk": "0.6.0"
  ink: "7.1.1"
  knip: "6.41.0"
  lefthook: "2.2.1"
  lucide-react: "1.55.0"
  msw: "2.15.0"
  oxfmt: "0.72.0"
  oxlint: "1.87.0"
  oxlint-tsgolint: "7.0.2004"
  react: "19.3.0"
  react-dom: "19.3.0"
  storybook: "10.6.2"
  syncpack: "15.3.3"
  tailwindcss: "4.3.3"
  tsup: "8.5.1"
  turbo: "2.11.7"
  tsx: "4.23.15"
  typescript: "7.0.2"
  typescript6: "npm:typescript@6.0.2"
  vite: "8.3.4"
  vitest: "4.1.8"

minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Node-only HTTP interception; no browser worker setup needed.
  msw: false
engineStrict: true
