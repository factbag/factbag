packages:
  - "packages/*"
  - "examples/*"
  - "tooling/*"

catalog:
  "@microsoft/api-extractor": "7.59.1"
  "@types/node": "22.20.0"
  "@types/react": "19.3.0"
  "@typesafe-ai/sdk": "0.6.0"
  ink: "7.1.1"
  knip: "6.37.0"
  lefthook: "2.1.14"
  msw: "2.15.0"
  oxfmt: "0.68.0"
  oxlint: "1.83.0"
  oxlint-tsgolint: "0.24.0"
  react: "19.3.0"
  syncpack: "15.3.3"
  turbo: "2.11.2"
  tsx: "4.23.15"
  typescript: "7.0.2"
  vitest: "4.1.11"

minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Node-only HTTP interception; no browser worker setup needed.
  msw: false
engineStrict: true
