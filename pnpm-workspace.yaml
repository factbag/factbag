packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"

catalog:
  "@changesets/cli": "3.0.3"
  "@microsoft/api-extractor": "7.59.4"
  "@storybook/addon-docs": "10.6.3"
  "@storybook/react-vite": "10.6.3"
  "@tailwindcss/vite": "4.3.3"
  "@types/node": "26.6.3"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@typesafe-ai/sdk": "0.7.0"
  ink: "7.1.1"
  knip: "6.42.0"
  lefthook: "2.2.2"
  lucide-react: "1.59.0"
  msw: "2.15.0"
  oxfmt: "0.73.0"
  oxlint: "1.88.0"
  oxlint-tsgolint: "7.0.2005"
  react: "19.3.1"
  react-dom: "19.3.1"
  storybook: "10.6.3"
  syncpack: "15.3.3"
  tailwindcss: "4.3.3"
  tsup: "8.5.1"
  turbo: "2.11.10"
  tsx: "4.23.15"
  typescript: "7.0.2"
  typescript6: "npm:typescript@6.0.2"
  vite: "8.3.5"
  vitest: "5.0.5"

minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Node-only HTTP interception; no browser worker setup needed.
  msw: false
engineStrict: true
