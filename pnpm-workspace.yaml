packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"

catalog:
  "@microsoft/api-extractor": "7.59.2"
  "@storybook/addon-docs": "10.6.1"
  "@storybook/react-vite": "10.6.1"
  "@tailwindcss/vite": "4.3.3"
  "@types/node": "22.20.0"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@typesafe-ai/sdk": "0.6.0"
  ink: "7.1.1"
  knip: "6.38.0"
  lefthook: "2.1.14"
  lucide-react: "1.48.0"
  msw: "2.15.0"
  oxfmt: "0.70.0"
  oxlint: "1.85.0"
  oxlint-tsgolint: "0.24.0"
  react: "19.3.0"
  react-dom: "19.3.0"
  storybook: "10.6.1"
  syncpack: "15.3.3"
  tailwindcss: "4.3.3"
  turbo: "2.11.4"
  tsx: "4.23.15"
  typescript: "7.0.2"
  vite: "8.3.1"
  vitest: "4.1.8"

minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Node-only HTTP interception; no browser worker setup needed.
  msw: false
engineStrict: true
