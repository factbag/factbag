name: Knip

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip and publish summary
        run: |
          set +e
          pnpm knip 2>&1 | tee knip-output.txt
          knip_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Knip report"
            echo
            echo "<details open>"
            echo "<summary>Knip output</summary>"
            echo
            echo '```text'
            sed -E 's/\x1b\[[0-9;]*m//g' knip-output.txt
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${knip_status}"
