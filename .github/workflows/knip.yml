name: Knip

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip and publish summary
        run: |
          set +e
          pnpm knip 2>&1 | tee knip-output.txt
          knip_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Knip report"
            echo
            echo "<details open>"
            echo "<summary>Knip output</summary>"
            echo
            echo '```text'
            sed -E 's/\x1b\[[0-9;]*m//g' knip-output.txt
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${knip_status}"
