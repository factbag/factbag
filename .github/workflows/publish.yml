name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify the release without publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: factbag-release
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'factbag/factbag' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select release mode
        id: changesets
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release:prepare
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"

  pack:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.changesets.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check source and build
        run: pnpm check
      - name: Verify build artifacts
        run: node scripts/verify-artifacts.ts
      - name: Check generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files changed during the build."
            exit 1
          fi
      - name: Pack releases
        id: changesets
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.publish-plan-artifact-id }}

  verify:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: .release
          merge-multiple: true
      - name: Verify the packed release and consumers
        run: pnpm release:verify-packed

  publish:
    needs: [pack, verify]
    if: ${{ github.event_name == 'push' || !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      PNPM_CONFIG_PROVENANCE: "true"
      PNPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@12.2.0 --ignore-scripts
      # Changesets publishes the same immutable artifact checked by the verify job.
      # No package build or lifecycle scripts run in this job.
      - name: Publish packages and create GitHub releases
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.artifact-id }}
      - name: Promote the published release to latest
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';

          const expected = JSON.parse(readFileSync('packages/factbag/package.json', 'utf8'));
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
          if (expected.name !== 'factbag' || typeof expected.version !== 'string') {
            throw new Error('Expected the canonical factbag release manifest');
          }
          if (process.env.PUBLISHED === 'true') {
            if (published.length !== 1 || published[0].name !== expected.name ||
                published[0].version !== expected.version) {
              throw new Error('Published packages do not match the reviewed release');
            }
          } else if (process.env.PUBLISHED !== 'false' || published.length !== 0) {
            throw new Error('Unexpected Changesets publication result');
          }

          // A retry may find the artifact's version already published. Confirm
          // that exact version exists before retrying the idempotent tag update.
          const spec = `${expected.name}@${expected.version}`;
          let version;
          for (let attempt = 0; attempt < 6; attempt++) {
            const lookup = spawnSync('npm',
              ['view', spec, 'version', '--json', '--prefer-online'], { encoding: 'utf8' });
            if (lookup.error) throw lookup.error;
            if (lookup.status === 0) {
              const response = JSON.parse(lookup.stdout);
              version = Array.isArray(response) && response.length === 1 ? response[0] : response;
              break;
            }
            const error = JSON.parse(lookup.stdout || '{}').error;
            if (error?.code !== 'E404' || attempt === 5) {
              throw new Error(lookup.stderr || `Registry lookup failed for ${spec}`);
            }
            const delay = Math.min(2000 * 2 ** attempt, 30000);
            console.error(`${spec} is not visible yet; retrying in ${delay / 1000}s`);
            await setTimeout(delay);
          }
          if (version !== expected.version) throw new Error('Published version mismatch');
          execFileSync('npm', ['dist-tag', 'add', spec, 'latest'], { stdio: 'inherit' });
          NODE
