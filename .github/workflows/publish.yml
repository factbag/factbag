name: Publish

run-name: Publish factbag@${{ inputs.version }} (dry run=${{ inputs.dry-run }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in packages/factbag/package.json
        required: true
        type: string
      dry-run:
        description: Build and verify without publishing
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: factbag-npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'factbag/factbag' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      integrity: ${{ steps.release.outputs.integrity }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check source and build
        run: pnpm check
      - name: Pack and verify release consumers
        run: pnpm release:verify
      - name: Check generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files changed during the build."
            exit 1
          fi
      - name: Prepare immutable release artifact
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-artifact.ts prepare .release "$RELEASE_VERSION"
      - name: Upload verified tarball and release metadata
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factbag-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publish/*
          if-no-files-found: error
          retention-days: 14

  dry-run:
    needs: build
    if: inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact.ts
            tooling/github/verify-release/action.yml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Verify release artifact
        uses: ./release-tools/tooling/github/verify-release
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          version: ${{ needs.build.outputs.version }}
          integrity: ${{ needs.build.outputs.integrity }}

  publish:
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Only trusted release tooling is checked out. No dependencies or build caches
      # enter the job with publishing authority, and package scripts never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact.ts
            tooling/github/verify-release/action.yml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Verify approved artifact
        uses: ./release-tools/tooling/github/verify-release
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          version: ${{ needs.build.outputs.version }}
          integrity: ${{ needs.build.outputs.integrity }}
      - name: Publish with OIDC
        run: npm publish ./candidate/factbag.tgz --access=public --tag=latest --ignore-scripts --provenance --registry=https://registry.npmjs.org

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release tag after publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="factbag@$RELEASE_VERSION"
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
