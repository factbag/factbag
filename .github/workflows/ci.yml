name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Test the exact minimum plus the latest patch of every supported line.
        node-version:
          - "22.18.0"
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup and install
        uses: ./tooling/github/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify packed packages (TypeScript 6 and 7)
        run: pnpm build:verify

      - name: Check API reports
        run: pnpm api-report:check

      - name: Check committed generated files are in sync
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff | head -200
            echo "::error::A generated file is out of sync with its generator. Run the relevant generator (for API reports: 'pnpm api-report') and commit the result."
            exit 1
          fi
