name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One entry per release line `engines.node` supports. Bare majors, so each
        # leg runs that line's latest patch and picks up its security fixes; an
        # `lts/*` alias is avoided because it would jump major without a commit.
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and install
        uses: ./tooling/github/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check API reports
        run: pnpm api-report:check

      - name: Check committed generated files are in sync
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff | head -200
            echo "::error::A generated file is out of sync with its generator. Run 'pnpm generate && pnpm build' and commit the result."
            exit 1
          fi
